services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 生产环境务必改为强随机值；可用任意口令（服务会派生密钥）或 44 字符 Fernet 密钥
      REDACTION_MASTER_KEY: ${REDACTION_MASTER_KEY:-dev-only-change-me}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-86400}
      # MAPPING_TTL_SECONDS: "604800"   # 映射默认有效期（秒），不设置则永不过期
    volumes:
      - redaction-data:/data
    restart: unless-stopped

volumes:
  redaction-data:
